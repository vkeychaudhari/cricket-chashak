  <main id="main">
    <!-- =====================================================
         TAB 1 — SEASON 2
         ===================================================== -->
    <div class="tab-panel" id="panel-season2" data-panel="season2">

      <!-- HERO -->
      <section class="hero" id="home" aria-labelledby="heroTitle">
        <div class="hero__bg" aria-hidden="true"></div>
        <div class="hero__fx" aria-hidden="true"></div>

        <div class="hero__inner">
          <div class="hero__emblem">
            <img data-emblem-alt src="images/theme/logo-emblem-600.webp"
                 srcset="images/theme/logo-emblem-600.webp 600w, images/theme/logo-emblem-1000.webp 989w"
                 sizes="(min-width: 1024px) 430px, 78vw" width="989" height="945" alt="" fetchpriority="high">
          </div>

          <div class="hero__content">
            <h1 id="heroTitle" class="hero__title">
              <span class="l1" data-t="@nameLine1"></span>
              <span class="l2" data-t="@nameLine2"></span>
            </h1>
            <div class="hero__accent" aria-hidden="true"></div>
            <div class="hero__season-row"><span class="hero__season" data-t="@season"></span></div>
            <p class="hero__tagline" data-t="@tagline"></p>
            <div class="gold-divider" aria-hidden="true"></div>

            <section class="cd" id="countdown" data-state="running" aria-labelledby="cdLabel">
              <h2 class="cd__label" id="cdLabel"><svg class="i" aria-hidden="true"><use href="#i-gavel"></use></svg><span data-t="countdownAuction"></span></h2>
              <div class="cd__grid" role="timer" aria-live="off">
                <div class="cd__cell"><b class="cd__num">00</b><span class="cd__unit" data-t="days"></span></div>
                <div class="cd__cell"><b class="cd__num">00</b><span class="cd__unit" data-t="hours"></span></div>
                <div class="cd__cell"><b class="cd__num">00</b><span class="cd__unit" data-t="minutes"></span></div>
                <div class="cd__cell"><b class="cd__num">00</b><span class="cd__unit" data-t="seconds"></span></div>
              </div>
              <p class="cd__msg"></p>
              <p class="cd__sub"></p>
            </section>

            <div class="hero__cta">
              <a class="btn btn--gold btn--lg" href="#" data-register>
                <svg class="i" aria-hidden="true"><use href="#i-user-plus"></use></svg>
                <span data-t="registerNow"></span>
                <svg class="i" aria-hidden="true"><use href="#i-right"></use></svg>
              </a>
              <a class="btn btn--ghost" href="#key-info">
                <span data-t="viewDetails"></span>
                <svg class="i" aria-hidden="true"><use href="#i-down"></use></svg>
              </a>
            </div>
          </div>
        </div>
      </section>

      <!-- TICKER -->
      <div class="ticker" aria-hidden="true"><div class="ticker__track" id="ticker"></div></div>

      <!-- KEY INFO -->
      <section class="section section--dark" id="key-info">
        <div class="container">
          <header class="sec-head reveal">
            <span class="eyebrow" data-t="keyInfoEyebrow"></span>
            <h2 data-t="keyInfoTitle"></h2>
          </header>
          <div class="bento" id="keyInfo"></div>
        </div>
      </section>

      <!-- PRIZES -->
      <section class="section section--prizes" id="prizes">
        <div class="container">
          <header class="sec-head reveal">
            <span class="eyebrow" data-t="prizesEyebrow"></span>
            <h2 data-t="prizesTitle"></h2>
          </header>
          <div class="prizes" id="teamPrizes"></div>
          <h3 class="sub-head reveal"><span data-t="individualAwards"></span></h3>
          <div class="ind" id="individualPrizes"></div>
        </div>
      </section>

      <!-- SCHEDULE -->
      <section class="section section--light" id="schedule">
        <div class="container">
          <header class="sec-head reveal">
            <span class="eyebrow" data-t="scheduleEyebrow"></span>
            <h2 data-t="scheduleTitle"></h2>
          </header>
          <ol class="timeline" id="timeline"></ol>
          <div class="venue reveal" id="venue"></div>
        </div>
      </section>

      <!-- QUOTES -->
      <section class="section section--quotes" id="quotes">
        <div class="container">
          <header class="sec-head reveal">
            <span class="eyebrow" data-t="quotesEyebrow"></span>
            <h2 data-t="quotesTitle"></h2>
          </header>
          <div class="quotes">
            <figure class="portrait reveal" id="portrait"></figure>
            <div class="qcar reveal" id="quoteCar" role="region" aria-roledescription="carousel">
              <div class="qcar__track" data-track data-viewport id="quoteTrack"></div>
              <div class="progress"><span data-progress></span></div>
              <div class="car-ctrl" data-controls></div>
            </div>
          </div>
        </div>
      </section>

      <!-- SPONSORSHIP (cards + contact rendered from config.sponsors) -->
      <section class="section section--sponsors" id="sponsors" aria-labelledby="sponsorsTitle">
        <div class="container">
          <header class="sec-head reveal">
            <span class="eyebrow" data-t="sponsorsEyebrow"></span>
            <h2 id="sponsorsTitle" data-t="sponsorsTitle"></h2>
            <p class="sp-intro" data-t="sponsorsText"></p>
            <a class="btn btn--gold sp-head__cta" href="#sponsor-contact">
              <svg class="i" aria-hidden="true"><use href="#i-handshake"></use></svg>
              <span data-t="becomeSponsor"></span>
              <svg class="i" aria-hidden="true"><use href="#i-right"></use></svg>
            </a>
          </header>
          <div class="sp-grid" id="sponsorTiers"></div>
          <div class="sp-assoc reveal" id="sponsorAssoc"></div>
          <div class="sp-contact reveal" id="sponsor-contact"></div>
        </div>
      </section>

      <!-- CTA + CONTACT -->
      <section class="section section--light" id="contact">
        <div class="container">
          <div class="cta reveal">
            <h2 data-t="ctaTitle"></h2>
            <p data-t="ctaText"></p>
            <a class="btn btn--gold btn--lg" href="#" data-register>
              <svg class="i" aria-hidden="true"><use href="#i-user-plus"></use></svg>
              <span data-t="registerNow"></span>
              <svg class="i" aria-hidden="true"><use href="#i-right"></use></svg>
            </a>
          </div>

          <header class="sec-head sec-head--spaced reveal">
            <span class="eyebrow" data-t="contactEyebrow"></span>
            <h2 data-t="contactTitle"></h2>
          </header>
          <div class="contact" id="contactCards"></div>
        </div>
      </section>
    </div>

    <!-- =====================================================
         TAB 2 — SEASON 1 SUCCESS STORY
         ===================================================== -->
    <div class="tab-panel" id="panel-season1" data-panel="season1" hidden>

      <!-- INTRO BANNER -->
      <section class="s1-hero" id="season1-story" aria-labelledby="s1Heading">
        <div class="hero__fx" aria-hidden="true"></div>
        <div class="s1-hero__inner">
          <div class="s1-hero__text">
            <span class="pill-badge"><svg class="i" aria-hidden="true"><use href="#i-star"></use></svg><span data-t="navSeason1"></span><span data-t="navSeason1Suffix"></span></span>
            <h1 id="s1Heading">
              <span class="l1" data-t="@nameLine1"></span>
              <span class="l2" data-t="@nameLine2"></span>
            </h1>
            <div class="hero__season" id="s1Season"></div>
            <h2 class="s1-hero__sub" data-t="s1Title"></h2>
            <div class="s1-story" id="s1Story"></div>
            <div class="s1-stats" id="s1Stats"></div>
          </div>
          <div class="s1-hero__art" aria-hidden="true">
            <div class="rays"></div>
            <svg class="s1-hero__trophy" viewBox="0 0 64 64"><use href="#i-trophy-fill"></use></svg>
          </div>
        </div>
      </section>

      <!-- OWNER & TEAM SLIDESHOW -->
      <section class="section section--light" id="teams">
        <div class="container">
          <header class="sec-head reveal">
            <span class="eyebrow" data-t="teamsEyebrow"></span>
            <h2 data-t="teamsTitle"></h2>
          </header>
          <div class="tcar reveal" id="teamCar" role="region" aria-roledescription="carousel">
            <div class="tcar__vp" data-viewport>
              <div class="tcar__track" data-track id="teamTrack"></div>
            </div>
            <div class="progress progress--light"><span data-progress></span></div>
            <div class="car-ctrl car-ctrl--center" data-controls></div>
          </div>
        </div>
      </section>

      <!-- FINAL STANDINGS -->
      <section class="section section--podium" id="standings">
        <div class="container">
          <header class="sec-head reveal">
            <span class="eyebrow" data-t="standingsEyebrow"></span>
            <h2 data-t="standingsTitle"></h2>
          </header>
          <div class="podium" id="podium"></div>
          <div class="podium-floor" aria-hidden="true"></div>
          <div id="podium4"></div>
        </div>
      </section>

      <!-- PLAYER AWARDS -->
      <section class="section section--light" id="awards">
        <div class="container">
          <header class="sec-head reveal">
            <span class="eyebrow" data-t="awardsEyebrow"></span>
            <h2 data-t="awardsTitle"></h2>
          </header>
          <div class="awards" id="awardCards"></div>
        </div>
      </section>

      <!-- GALLERY -->
      <section class="section section--dark" id="gallery">
        <div class="container">
          <header class="sec-head reveal">
            <span class="eyebrow" data-t="galleryEyebrow"></span>
            <h2 data-t="galleryTitle"></h2>
          </header>
          <div class="gallery" id="galleryGrid"></div>
        </div>
      </section>
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="ftr">
    <div class="ftr__grid">
      <div class="ftr__about">
        <div class="ftr__brand">
          <img data-logo src="images/theme/logo-header.webp" alt="" width="192" height="183" loading="lazy">
          <div>
            <strong data-t="@name"></strong>
            <span data-t="@season"></span>
          </div>
        </div>
        <p class="ftr__tagline" data-t="@tagline"></p>
        <p class="ftr__org" id="ftrOrg" hidden></p>
      </div>
      <div>
        <h4 data-t="quickLinks"></h4>
        <ul class="ftr__links">
          <li><a href="#season2" data-tab-link="season2" data-t="navSeason2"></a></li>
          <li><a href="#" data-register data-t="navRegister"></a></li>
          <li><a href="#season1" data-tab-link="season1"><span data-t="navSeason1"></span><span data-t="navSeason1Suffix"></span></a></li>
          <li><a href="#schedule" data-t="scheduleEyebrow"></a></li>
          <li><a href="#sponsors" data-t="navSponsors"></a></li>
        </ul>
      </div>
      <div>
        <h4 data-t="contactHeading"></h4>
        <ul class="ftr__links" id="ftrPhones"></ul>
        <div class="ftr__social" id="ftrSocial"></div>
      </div>
    </div>
    <div class="ftr__bottom">
      <span>© <span id="year"></span> <span data-t="@shortName"></span>. <span data-t="rights"></span></span>
      <span data-t="madeWith"></span>
    </div>
  </footer>

  <!-- Mobile floating contact bar -->
  <nav class="dock" id="dock" aria-label="Quick contact"></nav>
  <!-- Desktop floating WhatsApp -->
  <a class="fab-wa" id="fabWa" target="_blank" rel="noopener">
    <svg class="i" aria-hidden="true"><use href="#i-whatsapp"></use></svg>
  </a>

  <!-- Call number chooser -->
  <div class="sheet" id="callSheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet__grip"></div>
      <h3 id="sheetTitle" data-t="chooseNumber"></h3>
      <div class="phones" id="sheetPhones"></div>
      <button type="button" class="btn btn--outline sheet__close" data-close><span data-t="close"></span></button>
    </div>
  </div>

  <!-- Gallery lightbox -->
  <div class="lb" id="lightbox" hidden role="dialog" aria-modal="true">
    <button type="button" class="lb__btn lb__close" data-lb="close" data-t-aria="close"><svg class="i" aria-hidden="true"><use href="#i-x"></use></svg></button>
    <button type="button" class="lb__btn lb__prev" data-lb="prev" data-t-aria="prev"><svg class="i" aria-hidden="true"><use href="#i-left"></use></svg></button>
    <figure class="lb__fig">
      <img id="lbImg" alt="">
      <figcaption><span id="lbCap"></span><small id="lbCount"></small></figcaption>
    </figure>
    <button type="button" class="lb__btn lb__next" data-lb="next" data-t-aria="next"><svg class="i" aria-hidden="true"><use href="#i-right"></use></svg></button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
