<!doctype html>
<!-- Template for images/og-image.jpg (the WhatsApp link-preview picture, 1200x630).
     Edit the text below, then re-generate — see README.md → "Regenerate the share image". -->
<html lang="mr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@600;700;800&family=Poppins:wght@600;700;800&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: "Mukta", sans-serif; color: #fff;
    background:
      radial-gradient(55% 60% at 88% 10%, rgba(242,193,78,.32), transparent 62%),
      radial-gradient(60% 70% at 0% 100%, rgba(31,143,88,.65), transparent 62%),
      linear-gradient(160deg, #073020, #03190f);
  }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 46px 46px; -webkit-mask-image: radial-gradient(ellipse at 60% 40%, #000 20%, transparent 75%); }
  .wm { position: absolute; right: -20px; bottom: -90px; font: 800 440px/1 "Mukta"; color: transparent; -webkit-text-stroke: 2px rgba(242,193,78,.12); }
  .wrap { position: relative; display: flex; align-items: center; gap: 56px; height: 100%; padding: 0 70px; }
  .logo { width: 330px; height: 330px; flex: none; filter: drop-shadow(0 20px 40px rgba(0,0,0,.5)); }
  .badge { display: inline-block; padding: 8px 20px; border-radius: 999px; background: rgba(242,193,78,.14); border: 1.5px solid rgba(242,193,78,.45); color: #fbe3a1; font-weight: 700; font-size: 26px; }
  h1 { margin: 16px 0 0; font-weight: 800; line-height: 1.12; }
  h1 .a { display: block; font-size: 52px; }
  h1 .b { display: block; font-size: 96px; background: linear-gradient(100deg, #fff3c4, #f2c14e 45%, #e0a82e); -webkit-background-clip: text; color: transparent; }
  .season { display: inline-block; margin-top: 10px; padding: 6px 22px; border-radius: 14px; border: 2px solid rgba(255,255,255,.3); font-weight: 700; font-size: 38px; }
  .meta { margin-top: 22px; font: 600 27px/1.3 "Poppins"; color: rgba(255,255,255,.88); }
  .meta b { color: #f2c14e; }
  .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: linear-gradient(90deg, #e0a82e, #f2c14e, #e0a82e); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wm">०२</div>
  <div class="wrap">
    <img class="logo" src="../images/logo.svg" alt="">
    <div>
      <span class="badge">पर्व २ · नोंदणी सुरू!</span>
      <h1><span class="a">महात्मा ज्योतिराव फुले</span><span class="b">क्रिकेट चषक</span></h1>
      <span class="season">पर्व ०२ – २०२७</span>
      <p class="meta">12 Teams <b>•</b> 120 Players <b>•</b> 9–10 Jan 2027 <b>•</b> Nashik</p>
    </div>
  </div>
  <div class="strip"></div>
</body>
</html>
